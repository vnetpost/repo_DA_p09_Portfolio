<section class="hero" aria-label="Intro">
  <div class="hero__content">
    <div class="hero__title-group">
      <h1 class="hero__title">
        <span class="hero__title-line">Frontend</span>
        <span class="hero__title-line">Developer</span>
      </h1>
      <div class="hero__down">
        <span class="hero__line" aria-hidden="true"></span>
        <span class="hero__name">{{ userDBS.personalInfo.name }}</span>
      </div>
    </div>
  </div>

  <a class="hero__email" [href]="'mailto:' + userDBS.personalInfo.emailAddress">
    {{ userDBS.personalInfo.emailAddress }}
  </a>

  <div class="hero__scroll" aria-hidden="true">
    <div class="hero__arrow-wrapper">
      <img class="hero__arrow-icon" src="/assets/img/icons/arrow.svg" alt="arrow icon" />
    </div>
    <span class="hero__scroll-text">Scroll Down</span>
  </div>
</section>
