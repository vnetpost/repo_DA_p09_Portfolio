<section class="privacy-policy" id="policy" aria-labelledby="privacy-policy-title">
  <div class="privacy-policy__frame">
    <div class="privacy-policy__back-wrap">
      <a class="privacy-policy__back" routerLink="/" fragment="contact"
        [attr.aria-label]="'POLICY.BACK_ARIA' | translate">
        <img src="/assets/img/icons/arrow-rl.svg" [attr.alt]="'POLICY.BACK_ICON_ALT' | translate" />
      </a>
    </div>
    <h1 class="privacy-policy__title" id="privacy-policy-title">{{ 'POLICY.TITLE' | translate}}</h1>

    <section class="privacy-policy__section" aria-labelledby="privacy-subtitle-1">
      <h2 class="privacy-policy__section-title" id="privacy-subtitle-1">{{ 'POLICY.SECTION_1_TITLE' | translate }}</h2>
      <p class="privacy-policy__text">{{ 'POLICY.SECTION_1_TEXT' | translate }}</p>
    </section>

    <section class="privacy-policy__section" aria-labelledby="privacy-subtitle-2">
      <h2 class="privacy-policy__section-title" id="privacy-subtitle-2">{{ 'POLICY.SECTION_2_TITLE' | translate }}</h2>
      <p class="privacy-policy__text">{{ 'POLICY.SECTION_2_TEXT' | translate }}</p>
    </section>
  </div>
</section>
