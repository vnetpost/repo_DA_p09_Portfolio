<section class="skills" id="skills" aria-labelledby="skills-title">
  <div class="skills__frame">
    <div class="skills__headline">
      <h2 class="skills__title" id="skills-title">My skills</h2>
    </div>

    <ul class="skills__list">
      @for (item of userDBS.skillsList; track item.name; let idx = $index) {
      <li class="skills__item">
        <img class="skills__icon" [src]="item.imgPath" [alt]="item.name + ' icon'" />
        <span class="skills__label">{{ item.name }}</span>
      </li>
      }
    </ul>

    <div class="skills__cta">
      <img class="skills__cta-icon" src="/assets/img/icons/skills-icons/continued-learning.svg"
        alt="Continued learning icon" />
      <p class="skills__cta-text">
        Don't see the skill you need? <a class="skills__cta-link" href="#contact">Contact me</a>
        I'm always ready to learn!
      </p>
    </div>
  </div>
  <a class="skills__separator-link" href="#portfolio" aria-label="Go to portfolio section">
    <app-section-seperator-left-right />
  </a>
</section>
