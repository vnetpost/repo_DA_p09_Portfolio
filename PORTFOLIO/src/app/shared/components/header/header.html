<header class="header">
  <section class="header__inner">
    <a class="header__logo" routerLink="/" aria-label="Go to homepage">
      <img src="/assets/img/logo/logo1.svg" alt="logo" />
    </a>
    <div class="header__lang-and-menu" aria-label="Language and menu controls">
      <div class="header__lang-buttons" aria-label="Language selection">
        <button type="button" class="header__lang-button" (click)="setLang('en')"
          [class.header__lang-button--active]="lang === 'en'">
          EN
        </button>

        <button type="button" class="header__lang-button" (click)="setLang('de')"
          [class.header__lang-button--active]="lang === 'de'">
          DE
        </button>
      </div>

      <button type="button" class="header__burger-menu-btn" (click)="toggleMenu()" [class.is-open]="isMenuOpen"
        [attr.aria-expanded]="isMenuOpen" aria-controls="mobile-menu"
        [attr.aria-label]="isMenuOpen ? 'Close navigation menu' : 'Open navigation menu'">
        <span class="header__burger-frames" aria-hidden="true">
          <img class="frame f1" src="/assets/img/icons/anim-icons/anim-burger/burger1.svg" alt="" />
          <img class="frame f2" src="/assets/img/icons/anim-icons/anim-burger/burger2.svg" alt="" />
          <img class="frame f3" src="/assets/img/icons/anim-icons/anim-burger/burger3.svg" alt="" />
          <img class="frame f4" src="/assets/img/icons/anim-icons/anim-burger/burger4.svg" alt="" />
          <img class="frame f5" src="/assets/img/icons/anim-icons/anim-burger/burger5.svg" alt="" />
        </span>
      </button>

      <!-- src="/assets/img/icons/anim-icons/anim-burger/burger5.svg" -->
    </div>
  </section>

  @if (isMenuOpen) {
  <section id="mobile-menu" class="menu-overlay" role="dialog" aria-modal="true" aria-label="Main navigation menu">
    <div class="menu-overlay__panel">
      <nav class="menu-overlay__nav" aria-label="Main navigation">
        <a class="menu-overlay__nav-link" routerLink="/about" (click)="closeMenu()">
          <span>About me</span>
          <div class="menu-overlay__nav-link-anim"></div>
        </a>
        <a class="menu-overlay__nav-link" routerLink="/skills" (click)="closeMenu()">
          <span>My skills</span>
          <div class="menu-overlay__nav-link-anim"></div>
        </a>
        <a class="menu-overlay__nav-link" routerLink="/portfolio" (click)="closeMenu()">
          <span>Portfolio</span>
          <div class="menu-overlay__nav-link-anim"></div>
        </a>
      </nav>

      <section class="menu-overlay__footer" aria-label="footer with Contact information">
        <div class="menu-overlay__contact">
          <h2>Say hi!</h2>
          <a class="menu-overlay__mail" [href]="'mailto:' + userDBS.personalInfo.emailAddress">
            {{ userDBS.personalInfo.emailAddress }}
          </a>
        </div>

        <div class="menu-overlay__social-links">
          <a class="menu-overlay__social-link" href="#" aria-label="GitHub profile">
            <img class="menu-overlay__icon" src="/assets/img/icons/github.svg" alt="GitHub icon" />
          </a>
          <a class="menu-overlay__social-link" href="#" aria-label="Send email">
            <img class="menu-overlay__icon" src="/assets/img/icons/mail.svg" alt="Mail icon" />
          </a>
          <a class="menu-overlay__social-link" href="#" aria-label="LinkedIn profile">
            <img class="menu-overlay__icon" src="/assets/img/icons/linkedIn.svg" alt="LinkedIn icon" />
          </a>
        </div>
      </section>
    </div>
  </section>
  }
</header>
